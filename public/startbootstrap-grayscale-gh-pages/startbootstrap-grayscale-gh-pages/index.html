<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Grayscale - Start Bootstrap Theme</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Font Awesome icons (free version)-->
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
    </head>
    <body id="page-top">
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand" href="#page-top">Secure Admin</a>
                <button class="navbar-toggler navbar-toggler-right" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                    Menu
                    <i class="fas fa-bars"></i>
                </button>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn" style="display: none;">Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        
        <!-- Login Section (Visible by default) -->
        <header class="masthead" id="login-section">
            <div class="container px-4 px-lg-5 d-flex h-100 align-items-center justify-content-center">
                <div class="d-flex justify-content-center w-100">
                    <div class="text-center col-md-6 col-lg-4">
                        <h1 class="mx-auto my-0 text-uppercase" style="font-size: 3rem;">Admin</h1>
                        <h2 class="text-white-50 mx-auto mt-2 mb-5">Zero Trust Architecture</h2>
                        
                        <form id="adminLoginForm" class="bg-black p-4 rounded" style="background: rgba(0,0,0,0.7) !important;">
                            <div class="form-group mb-3">
                                <input type="text" class="form-control" id="adminUser" placeholder="Username" required>
                            </div>
                            <div class="form-group mb-3">
                                <input type="password" class="form-control" id="adminPass" placeholder="Password" required>
                            </div>
                            <div class="form-group mb-4">
                                <input type="text" class="form-control" id="adminTotp" placeholder="MFA Code (TOTP)" required autocomplete="off">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Secure Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </header>
        
        <!-- Dashboard Section (Hidden by default) -->
        <section class="about-section text-center" id="dashboard-section" style="display: none; padding-top: 10rem; min-height: 100vh;">
            <div class="container px-4 px-lg-5">
                <div class="row gx-4 gx-lg-5 justify-content-center">
                    <div class="col-lg-10" id="admin-content">
                        <!-- Content injected via admin.js -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer-->
        <footer class="footer bg-black small text-center text-white-50"><div class="container px-4 px-lg-5">Copyright &copy; Secure Admin Panel 2026</div></footer>
        
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- DOMPurify for XSS Protection -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
        
        <!-- Custom JS -->
        <script src="js/scripts.js"></script>
        <script src="js/admin.js"></script>
    </body>
</html>
