<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Eraser Web (AI 去手寫)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .upload-area {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            background: #f0f8ff;
            transition: all 0.3s;
        }
        .upload-area:hover {
            background: #e1f0fa;
        }
        .settings-group {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .setting-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .preview-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .preview-box {
            flex: 1;
            text-align: center;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #2980b9;
        }
        .btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #3498db;
            text-align: center;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background-color: #3498db;
            width: 100%;
            animation: indeterminate 1.5s infinite linear;
            transform-origin: 0% 50%;
        }
        @keyframes indeterminate {
            0% { transform: translateX(0) scaleX(0); }
            40% { transform: translateX(0) scaleX(0.4); }
            100% { transform: translateX(100%) scaleX(0.5); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Magic Eraser Web ✨</h1>
        <p style="text-align: center;">考卷手寫筆跡去除工具 (雲端運算版)</p>
        
        <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <h3>點擊或拖曳考卷圖片至此</h3>
            <p>支援 JPG, PNG</p>
            <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg" style="display: none;">
        </div>

        <div class="settings-group">
            <div class="setting-item">
                <label><strong>要去除的顏色:</strong></label>
                <label><input type="radio" name="color_type" value="red"> 紅色</label>
                <label><input type="radio" name="color_type" value="blue"> 藍色</label>
                <label><input type="radio" name="color_type" value="both" checked> 所有彩色</label>
            </div>
            <div class="setting-item">
                <label><input type="checkbox" id="cb_inpaint"> 使用智慧修補</label>
            </div>
            <div class="setting-item">
                <label><input type="checkbox" id="cb_enhance"> 增強黑白對比</label>
            </div>
        </div>

        <div style="text-align: center;">
            <button id="processBtn" class="btn" disabled>開始去除手寫筆跡</button>
            <button id="downloadBtn" class="btn" style="background: #2ecc71; display: none;">下載結果</button>
        </div>

        <div id="status">請上傳圖片</div>
        
        <div class="progress-bar" id="progressBarContainer">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="preview-container">
            <div class="preview-box">
                <h3>原圖 (Input)</h3>
                <canvas id="inputCanvas"></canvas>
            </div>
            <div class="preview-box">
                <h3>處理後 (Output)</h3>
                <canvas id="outputCanvas"></canvas>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
